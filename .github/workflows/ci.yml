name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go modules
        run: go mod download
      - name: Report formatting debt
        run: |
          files="$(gofmt -l ./apps ./internal)"
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
          fi
      - name: Vet
        run: go vet -mod=mod ./...
      - name: Test
        run: go test -mod=mod ./...
      - name: Build API
        run: go build -mod=mod ./apps/api

  admin-web:
    name: Admin Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
