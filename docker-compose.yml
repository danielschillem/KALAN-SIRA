services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kalan_sira
      POSTGRES_USER: kalan_sira
      POSTGRES_PASSWORD: kalan_sira_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalan_sira -d kalan_sira"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
